name: "Flake.lock: update Nix dependencies"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,6,12,18 * * *'

jobs:
  nix-flake-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix flake update
      - uses: peter-evans/create-pull-request@v8
        id: update
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          commit-message: "flake.lock: Update"
          title: "Update Nix flake inputs"
          body: "Automated update of flake.lock via `nix flake update`."
          branch: nix-flake-lock-update
          delete-branch: true
          labels: |
            dependencies
            automated
      - name: Merge
        if: ${{ steps.update.outputs.pull-request-number != '' }}
        run: gh pr merge --auto "${{ steps.update.outputs.pull-request-number }}" --rebase
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
